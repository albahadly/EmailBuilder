<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email body builder</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#0e1116; --panel:#161b22; --panel-2:#1c232c; --panel-3:#232b36;
    --line:#2b3441; --line-soft:#212932; --line-hover:#3a4553; --text:#e2e8f0; --muted:#8996a6;
    --accent:#4fd1ff; --accent-ink:#062430; --amber:#f0b429; --danger:#f2777a; --danger-ink:#3a0c0d; --ok:#5ac48f;
    --wire:rgba(79,209,255,.55); --wire-soft:rgba(240,180,41,.45); --hover-outline:rgba(79,209,255,.35);
    --stage-a:#0e1116; --stage-b:#101419;
    --code-bg:#0b0e12; --code-text:#c6d0dc; --tpl-bg:#0f141b;
    --overlay:rgba(5,8,11,.72); --shadow:rgba(0,0,0,.5);
    --note-bg:rgba(240,180,41,.07); --note-line:rgba(240,180,41,.25); --note-text:#e8c98a;
    --info-bg:rgba(79,209,255,.06); --info-line:rgba(79,209,255,.25); --info-text:#a9d9ea;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --ink:#f4f6f9; --panel:#ffffff; --panel-2:#f1f4f8; --panel-3:#e4eaf1;
    --line:#d2d9e3; --line-soft:#e3e8ef; --line-hover:#b3bfcd; --text:#1a2029; --muted:#5d6b7c;
    --accent:#0a7ea4; --accent-ink:#ffffff; --amber:#a86a00; --danger:#c1393c; --danger-ink:#ffffff; --ok:#2c8a5c;
    --wire:rgba(10,126,164,.55); --wire-soft:rgba(168,106,0,.45); --hover-outline:rgba(10,126,164,.4);
    --stage-a:#eaeef3; --stage-b:#e2e7ee;
    --code-bg:#f7f9fc; --code-text:#26313e; --tpl-bg:#f4f7fa;
    --overlay:rgba(20,28,38,.45); --shadow:rgba(15,25,40,.18);
    --note-bg:rgba(168,106,0,.08); --note-line:rgba(168,106,0,.28); --note-text:#6b4400;
    --info-bg:rgba(10,126,164,.07); --info-line:rgba(10,126,164,.3); --info-text:#0d5a75;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:48px;flex:0 0 48px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
  .brand b{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.01em}
  .brand span{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .brand .ver{color:var(--accent);border:1px solid var(--line);padding:1px 6px;border-radius:999px;line-height:1.5}

  .btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px;line-height:1.4;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--panel-3);border-color:var(--line-hover)}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .btn.icon{padding:5px 8px;font-family:var(--mono);font-size:11px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:var(--panel-2);border:0;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--panel-3);color:var(--accent)}
  select.btn{padding-right:6px}

  /* Topbar grouping: separators keep the preview toggles (which change how the
     canvas is displayed) visually apart from the editor theme toggle. */
  .tbsep{flex:0 0 1px;width:1px;height:20px;background:var(--line)}
  .tbgrp{display:flex;align-items:center;gap:8px}
  .tblabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .themetgl{font-size:13px;line-height:1.15}

  .main{display:flex;flex:1;min-height:0}

  .palette{flex:0 0 180px;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 40px;overflow-y:auto}
  .palette h4{margin:0 0 9px}
  .palette h4 + .chip{margin-top:0}
  .grp{margin-top:18px}
  .chip{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px;margin-bottom:5px;cursor:pointer;text-align:left;transition:border-color .12s,transform .06s}
  .chip:hover{border-color:var(--accent);transform:translateX(2px)}
  .chip svg{flex:0 0 16px;stroke:var(--muted)}
  .chip:hover svg{stroke:var(--accent)}
  .legend{margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft);line-height:1.7;color:var(--muted);font-size:11px}
  .legend code{font-family:var(--mono);color:var(--text);font-size:10px}

  .stage{flex:1;min-width:0;overflow-y:auto;padding:26px 20px 120px;background:repeating-linear-gradient(45deg,var(--stage-a) 0 12px,var(--stage-b) 12px 24px)}
  .stagewrap{margin:0 auto;transition:max-width .2s}
  .canvas{padding:1px}
  .dark .canvas{filter:invert(1) hue-rotate(180deg)}
  .blockwrap{position:relative}
  .blockwrap.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .blockwrap:hover:not(.sel){outline:1px solid var(--hover-outline);outline-offset:-1px}
  .bctl{position:absolute;top:-1px;right:-1px;display:none;gap:1px;z-index:5;background:var(--accent);border-radius:0 0 0 5px;overflow:hidden}
  .blockwrap:hover .bctl,.blockwrap.sel .bctl{display:flex}
  .bctl button{background:transparent;border:0;color:var(--accent-ink);cursor:pointer;font-family:var(--mono);font-size:11px;padding:3px 7px;line-height:1.4}
  .bctl button:hover{background:rgba(0,0,0,.18)}
  .tag{position:absolute;top:-1px;left:-1px;display:none;z-index:5;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:0 0 5px 0}
  .blockwrap.sel .tag{display:block}
  [contenteditable="true"]:focus{outline:2px dashed var(--accent);outline-offset:2px}
  .xray .canvas table{outline:1px dashed var(--wire);outline-offset:-1px}
  .xray .canvas td{outline:1px dotted var(--wire-soft);outline-offset:-1px}
  .empty{border:1px dashed var(--line);border-radius:8px;padding:40px;text-align:center;color:var(--muted);background:var(--panel)}

  .inspector{flex:0 0 282px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  .tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 4px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tabs button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle}
  .ibody{overflow-y:auto;padding:14px 13px 60px}
  .ibody h4{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .field{margin-bottom:11px}
  .field label{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:12px;font-family:var(--mono)}
  .field textarea{resize:vertical;min-height:64px;line-height:1.55}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
  .row{display:flex;gap:8px}
  .row .field{flex:1}
  .swatch{display:flex;gap:6px;align-items:center}
  .swatch input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);cursor:pointer;flex:0 0 28px}
  .note{display:flex;gap:7px;margin-top:14px;padding:9px 10px;border-radius:6px;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-text);font-size:11px;line-height:1.55}
  .note.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-text)}
  .note.info b{color:var(--accent)}
  .note b{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
  .sect{border-top:1px solid var(--line-soft);margin:16px 0 12px;padding-top:13px;display:flex;justify-content:space-between;align-items:center}
  details.adv{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px}
  details.adv summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary:before{content:"+ ";color:var(--accent)}
  details.adv[open] summary:before{content:"− "}

  .check{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:11.5px;line-height:1.55}
  .check i{flex:0 0 14px;font-style:normal;font-family:var(--mono);font-size:11px}
  .check.err i{color:var(--danger)} .check.warn i{color:var(--amber)} .check.ok i{color:var(--ok)}
  .check b{display:block;font-weight:600;margin-bottom:1px}
  .check span{color:var(--muted)}

  .fmt{position:fixed;z-index:40;display:none;gap:1px;background:var(--panel-3);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px var(--shadow);overflow:hidden;align-items:stretch}
  .fmt button{background:transparent;border:0;color:var(--text);cursor:pointer;padding:5px 9px;font-family:var(--mono);font-size:12px}
  .fmt button:hover{background:var(--accent);color:var(--accent-ink)}
  .fmt select{background:var(--panel-2);border:0;border-left:1px solid var(--line);font-family:var(--mono);font-size:11px;padding:0 6px;cursor:pointer}

  .modal{position:fixed;inset:0;z-index:50;display:none;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:36px 24px}
  .modal.open{display:flex;align-items:center;justify-content:center}
  .sheet{width:min(940px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .sheet header .eyebrow{margin-right:auto}
  .sheet pre{margin:0;flex:1;overflow:auto;padding:14px;background:var(--code-bg);font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--code-text);white-space:pre-wrap;word-break:break-word}
  .meter{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .bar{flex:1;height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden}
  .bar i{display:block;width:0;height:100%;background:var(--accent);transition:width .2s}
  .bar i.warn{background:var(--amber)}
  .tplsheet{width:min(860px,100%)}
  .tplbody{flex:1;overflow:auto;padding:14px;background:var(--tpl-bg)}
  .tplrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:9px}
  .tplname{font-family:var(--mono);font-size:12px;color:var(--text)}
  .tplmeta{margin-top:4px;font-size:11px;color:var(--muted)}
  .tplactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tplempty{padding:22px;border:1px dashed var(--line);border-radius:8px;background:var(--panel);color:var(--muted);line-height:1.6}
  .asksheet{width:min(540px,100%)}
  .askbody{padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
  .asktitle{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .askmsg{margin:0;font-size:12px;line-height:1.65;color:var(--text);white-space:pre-wrap}
  .askinput{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:12px;color:var(--text)}
  .askinput:focus{border-color:var(--accent);outline:none}
  .askfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink);font-weight:600}

  @media (max-width:1240px){.tblabel{display:none}}
  @media (max-width:980px){.palette{flex:0 0 150px}.inspector{flex:0 0 236px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<script>
/* Applied before first paint so a light-theme reload never flashes dark. */
(function () {
  var THEME_KEY = 'email_builder_theme_v1';
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = saved;
})();
</script>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><b>email/body</b><span class="ver" id="appVersion"></span><span>block → table serializer</span></div>
    <select class="btn" id="tplSel" title="Load a starter"><option value="">Start from…</option></select>
    <button class="btn" id="saveTplBtn" title="Save current design as a reusable template">Save template</button>
    <button class="btn" id="manageTplBtn" title="Manage saved custom templates">Manage templates</button>
    <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>

    <span class="tbsep" aria-hidden="true"></span>
    <span class="tbgrp" id="previewGrp">
      <span class="tblabel">preview</span>
      <div class="seg" id="viewSeg">
        <button data-w="0" class="on">desktop</button>
        <button data-w="375">mobile</button>
      </div>
      <button class="btn" id="darkBtn" title="Preview the email as a forced-dark client renders it. Does not change the exported HTML.">dark client</button>
      <button class="btn" id="xrayBtn" title="Outline the generated tables and cells">x-ray</button>
    </span>

    <span class="tbsep" aria-hidden="true"></span>
    <button class="btn" id="loadBtn">Open JSON</button>
    <button class="btn" id="saveBtn">Save JSON</button>
    <button class="btn primary" id="exportBtn">Export HTML</button>
    <span class="tbsep" aria-hidden="true"></span>
    <button class="btn icon themetgl" id="themeBtn" title="Editor theme" aria-label="Editor theme"></button>
    <input type="file" id="fileIn" accept="application/json" hidden>
    <input type="file" id="tplFileIn" accept="application/json" hidden>
  </div>

  <div class="main">
    <aside class="palette" id="palette"></aside>
    <main class="stage" id="stage"><div class="stagewrap" id="stagewrap"></div></main>
    <aside class="inspector">
      <div class="tabs" id="tabs">
        <button data-tab="block" class="on">Block</button>
        <button data-tab="email">Email</button>
        <button data-tab="checks">Checks<span class="dot" id="tabDot" hidden></span></button>
      </div>
      <div class="ibody" id="ibody"></div>
    </aside>
  </div>
</div>

<div class="fmt" id="fmt">
  <button data-cmd="bold"><b>B</b></button>
  <button data-cmd="italic"><i>I</i></button>
  <button data-cmd="underline"><u>U</u></button>
  <button data-cmd="link">link</button>
  <button data-cmd="unlink">unlink</button>
  <select id="tagSel"><option value="">merge tag</option></select>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <header>
      <span class="eyebrow">Generated output</span>
      <div class="seg" id="modeSeg">
        <button data-mode="body" class="on">body only</button>
        <button data-mode="full">full document</button>
        <button data-mode="text">plain text</button>
      </div>
      <button class="btn" id="minBtn" title="Strip newlines and indentation">minify</button>
      <button class="btn" id="copyBtn">Copy</button>
      <button class="btn" id="dlBtn">Download</button>
      <button class="btn" id="closeBtn">Close</button>
    </header>
    <pre id="code"></pre>
    <div class="meter">
      <span id="sizeLabel">0 KB</span>
      <div class="bar"><i id="sizeBar"></i></div>
      <span>Gmail clips at 102 KB</span>
    </div>
  </div>
</div>

<div class="modal" id="tplModal">
  <div class="sheet tplsheet">
    <header>
      <span class="eyebrow">Custom templates</span>
      <button class="btn" id="tplSaveCurrentBtn">Save current</button>
      <button class="btn" id="tplImportBtn">Import JSON</button>
      <button class="btn" id="tplExportAllBtn">Export all</button>
      <button class="btn" id="tplCloseBtn">Close</button>
    </header>
    <div class="tplbody" id="tplBody"></div>
  </div>
</div>

<div class="modal" id="askModal">
  <div class="sheet asksheet" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <div class="askbody">
      <h4 class="asktitle" id="askTitle">Confirm</h4>
      <p class="askmsg" id="askMsg"></p>
      <input class="askinput" id="askInput" type="text">
    </div>
    <div class="askfoot">
      <button class="btn" id="askCancelBtn">Cancel</button>
      <button class="btn primary" id="askOkBtn">OK</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. MODEL
   ============================================================ */
let uid = 0;
const nid = () => 'b' + (++uid);
/* Single source of truth for the version. Rendered into the topbar badge on
   boot; the README carries its own copy that has to be bumped by hand. */
const APP_VERSION = 'v1.6';
const DRAFT_KEY = 'email_builder_draft_v1';
const STATE_SCHEMA_VERSION = 2;
const CUSTOM_TEMPLATES_KEY = 'email_builder_custom_templates_v1';
const IS_TEST_MODE = new URLSearchParams(location.search).get('test') === '1';
const MAX_STATE_BYTES = 1024 * 1024;
const MAX_BLOCK_COUNT = 250;
const MAX_CUSTOM_TEMPLATES = 80;
const MAX_TEMPLATE_IMPORT_BYTES = MAX_STATE_BYTES * 8;

const DEFAULT_SETTINGS = {
  width: 600, pad: 32, radius: 0,
  pageBg: '#eef1f5', cardBg: '#ffffff',
  font: 'Arial, Helvetica, sans-serif',
  text: '#1f2933', link: '#0b6bcb',
  safeReset: true,
  compatProfile: 'mainstream',
  dir: 'ltr', lang: 'en', esp: 'handlebars',
  preheader: 'Rule versioning, a faster evaluator, and the new visual builder.'
};

const COMPAT_PROFILES = [
  ['mainstream','Mainstream providers'],
  ['broad','Broad coverage'],
  ['legacy','Legacy-heavy coverage']
];

const doc = {
  settings: { ...DEFAULT_SETTINGS },
  blocks: []
};

const FONTS = [
  'Arial, Helvetica, sans-serif',
  '"Segoe UI", Roboto, Helvetica, Arial, sans-serif',
  'Georgia, "Times New Roman", serif',
  '"Helvetica Neue", Helvetica, Arial, sans-serif',
  'Verdana, Geneva, sans-serif',
  'Tahoma, Verdana, Segoe, sans-serif',
  '"Courier New", Courier, monospace'
];

const ESP = {
  handlebars: { label:'Handlebars / SendGrid', tags:['{{first_name}}','{{last_name}}','{{email}}','{{company}}','{{unsubscribe_url}}'] },
  mailchimp:  { label:'Mailchimp',             tags:['*|FNAME|*','*|LNAME|*','*|EMAIL|*','*|COMPANY|*','*|UNSUB|*'] },
  zoho:       { label:'Zoho Campaigns',        tags:['$[FNAME]$','$[LNAME]$','$[EMAIL]$','$[OPTOUT]$'] },
  postmark:   { label:'Postmark',              tags:['{{name}}','{{email}}','{{product_name}}','{{action_url}}'] },
  razor:      { label:'Razor / .NET string',   tags:['@Model.FirstName','@Model.Email','@Model.UnsubscribeUrl'] }
};

/* every block also gets: bg, pl, pr (side padding override) */
const DEFAULTS = {
  logo:    () => ({ type:'logo', src:'https://placehold.co/320x80/ffffff/0b6bcb/png?text=RULEWRIGHT', alt:'Rulewright', href:'https://example.com', width:160, align:'left', pt:28, pb:20 }),

/* ============================================================
   2. SERIALIZER
   ============================================================ */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const px  = n => Math.max(0, parseInt(n,10) || 0);
const gut = (b,s) => ({ l: b.pl == null || b.pl === '' ? s.pad : px(b.pl), r: b.pr == null || b.pr === '' ? s.pad : px(b.pr) });
const padStyle = (b,s) => { const g = gut(b,s); return `${px(b.pt)}px ${g.r}px ${px(b.pb)}px ${g.l}px`; };
const bgAttr  = b => b.bg ? ` bgcolor="${b.bg}"` : '';
const bgStyle = b => b.bg ? `background-color:${b.bg};` : '';
const fontOf  = (b,s) => b.font || s.font;
const colorOf = (b,s) => b.color || s.text;
const marginFor = a => a === 'center' ? 'margin:0 auto;' : a === 'right' ? 'margin:0 0 0 auto;' : 'margin:0;';
const de = (o,k) => o.edit ? ` data-edit="${k}"` : '';

/* A URL is safe when it carries no scheme at all (relative paths and ESP merge
   tags) or a scheme mail clients actually follow. Everything else is refused. */
const SAFE_URL_SCHEMES = new Set(['http','https','mailto','tel','sms']);
const URL_SCHEME_RE = /^([a-z][a-z0-9+.\-]*):/i;

function safeUrl(value, fallback = '#') {
  const raw = String(value ?? '').trim();
  if (!raw) return fallback;
  const probe = raw.replace(/[\u0000-\u0020\u007f]/g, '');
  const scheme = URL_SCHEME_RE.exec(probe);
  if (scheme && !SAFE_URL_SCHEMES.has(scheme[1].toLowerCase())) return fallback;
  return raw;
}

const SANITIZE_KEEP  = { A:1, STRONG:1, EM:1, U:1, BR:1, SPAN:1, P:1 };
const SANITIZE_MAP   = { B:'STRONG', I:'EM', DIV:'P', BLOCKQUOTE:'P' };
const SANITIZE_DROP  = { SCRIPT:1, STYLE:1, NOSCRIPT:1, TEMPLATE:1, IFRAME:1, OBJECT:1, EMBED:1,
                         FORM:1, INPUT:1, SELECT:1, TEXTAREA:1, BUTTON:1, HEAD:1, TITLE:1, META:1,
                         LINK:1, BASE:1, SVG:1, MATH:1, IMG:1, VIDEO:1, AUDIO:1, CANVAS:1 };
const SANITIZE_BREAK = /^(?:TR|LI|H[1-6]|HR|PRE|ADDRESS|DT|DD|FIGCAPTION|CAPTION)$/;
const SANITIZE_SPACE = /^(?:TD|TH)$/;

const isBreak = n => n && n.nodeType === 1 && n.tagName === 'BR';

/* Keeps a pasted layout readable once its structure is gone: one break per row
   or list item, never two in a row, and none left dangling at the end. */
function breakIfNeeded(to) {
  if (to.lastChild && !isBreak(to.lastChild)) to.append(document.createElement('br'));
}
function trimTrailingBreaks(el) {
  while (isBreak(el.lastChild)) el.lastChild.remove();
}

/* Copies allowed nodes into a fresh tree instead of editing the parsed one in
   place. Nothing can survive by being hoisted past the walk, and no attribute
   carries over unless it is written here. */
function sanitizeInto(from, to, s, ctx) {
  if (ctx.depth > 24) { to.append(from.textContent || ''); return; }
  [...from.childNodes].forEach(n => {
    if (n.nodeType === 3) { to.append(n.nodeValue); return; }
    if (n.nodeType !== 1) return;

    const tag = n.tagName;
    if (SANITIZE_DROP[tag]) return;

    const wanted = SANITIZE_MAP[tag] || tag;
    let mapped = wanted;
    if (mapped === 'P' && ctx.inP) mapped = '';
    if (mapped === 'A' && ctx.inA) mapped = '';

    if (mapped && SANITIZE_KEEP[mapped]) {
      const el = document.createElement(mapped.toLowerCase());
      if (mapped === 'A') {
        el.setAttribute('href', safeUrl(n.getAttribute('href')));
        el.setAttribute('target','_blank');
        el.setAttribute('style', `color:${s.link};text-decoration:underline;`);
      }
      if (mapped === 'P') el.setAttribute('style','margin:0 0 14px;');
      sanitizeInto(n, el, s, { depth: ctx.depth + 1, inP: ctx.inP || mapped === 'P', inA: ctx.inA || mapped === 'A' });
      if (mapped !== 'BR') trimTrailingBreaks(el);
      to.append(el);
      return;
    }

    const block = SANITIZE_BREAK.test(tag) || wanted === 'P';
    if (block) breakIfNeeded(to);
    else if (SANITIZE_SPACE.test(tag) && to.lastChild && !isBreak(to.lastChild)) to.append(' ');
    sanitizeInto(n, to, s, { depth: ctx.depth + 1, inP: ctx.inP, inA: ctx.inA });
    if (block) breakIfNeeded(to);
  });
}

function sanitize(html, s){
  const src = document.createElement('template');
  src.innerHTML = String(html ?? '');
  const out = document.createElement('div');
  sanitizeInto(src.content, out, s, { depth: 0, inP: false, inA: false });
  trimTrailingBreaks(out);
  return out.innerHTML.trim();
}

const RAW_DROP_TAGS = 'script,iframe,object,embed,form,meta,link,style,base,title,svg,math,noscript,frame,frameset,applet';
const RAW_URL_ATTRS = ['href','src','xlink:href','action','formaction','background','poster','data','codebase','cite'];

/* Raw blocks stay the escape hatch for ESP markup, so structure is preserved.
   A <template> parses inertly, which keeps referenced media from loading. */
function parseRawHtml(raw) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(raw || '');
  return tpl;
}

function sanitizeRawHtml(raw) {
  const tpl = parseRawHtml(raw);
  tpl.content.querySelectorAll(RAW_DROP_TAGS).forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const key = a.name.toLowerCase();
      if (key.startsWith('on') || key === 'srcdoc') { el.removeAttribute(a.name); return; }
      if (RAW_URL_ATTRS.includes(key) && safeUrl(a.value, '') === '') el.removeAttribute(a.name);
    });
  });
  return tpl.innerHTML;
}

/* Compares like with like: both sides are parser-normalised, so tidy-ups such
   as a closed <p> do not read as "something unsafe was stripped". */
function rawHtmlWasStripped(raw) {
  return sanitizeRawHtml(raw) !== parseRawHtml(raw).innerHTML;
}

const PT = 'role="presentation" border="0" cellpadding="0" cellspacing="0"';

/* Outlook's Word engine adds space around every table and ignores a <style>
   block, so these two have to ride inline on each one. Body-only export ships
   no stylesheet at all, which makes that the only place they can live. */
const TBL = 'border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;';
const tbl = (attrs = '', style = '') => `<table ${PT}${attrs ? ' ' + attrs : ''} style="${TBL}${style}">`;

function block(b, s, o = {}) {
  const G = gut(b,s);
  const inner = s.width - G.l - G.r;
  const P = padStyle(b,s);
  const F = fontOf(b,s);
  const C = colorOf(b,s);

  switch (b.type) {

  case 'logo': {

    return `<tr>
<td align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-size:0;">${b.href ? `<a href="${esc(safeUrl(b.href))}" target="_blank" style="text-decoration:none;">${img}</a>` : img}</td>
</tr>`;
  }

  case 'heading': {
    const tag = 'h' + b.level;
    return `<tr>
<td align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}">
<${tag}${de(o,'text')} style="margin:0;font-family:${F};font-size:${px(b.size)}px;line-height:${Math.round(px(b.size)*1.25)}px;font-weight:${b.weight};letter-spacing:${b.ls||0}px;color:${C};mso-line-height-rule:exactly;">${esc(b.text)}</${tag}>
</td>
</tr>`;

<td${de(o,'html')} align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};mso-line-height-rule:exactly;">${sanitize(b.html,s)}</td>
</tr>`;

  case 'button': {
    const borderW = px(b.borderW);
    const bd = borderW ? `border:${borderW}px solid ${b.borderC};` : '';
    const h = Math.max(24, px(b.py) * 2 + px(b.size) + 4);
    const arc = Math.max(0, Math.min(50, Math.round((px(b.radius) / h) * 100)));
    const labelW = Math.max(120, Math.round(String(b.label || '').length * (px(b.size) * 0.62)));
    const vmlW = b.full ? Math.max(120, inner) : labelW + px(b.px) * 2;
    const stroke = borderW ? `strokecolor="${b.borderC}" strokeweight="${borderW}px"` : 'stroked="f"';

    const mso = `<!--[if mso]>
  <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="${href}" style="height:${h}px;v-text-anchor:middle;width:${vmlW}px;" arcsize="${arc}%" fillcolor="${b.bgc}" ${stroke}>
  <center style="color:${b.color};font-family:${F};font-size:${px(b.size)}px;font-weight:bold;">${esc(b.label)}</center>
  </v:roundrect>
  <![endif]-->`;
    const btn = `<!--[if !mso]><!-->
  ${tbl(b.full ? 'width="100%"' : '', `border-collapse:separate;${b.full ? 'width:100%;' : ''}`)}
<tr>
<td align="center" bgcolor="${b.bgc}" style="border-radius:${px(b.radius)}px;${bd}padding:${px(b.py)}px ${px(b.px)}px;">
<a href="${href}" target="_blank" style="display:block;font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.size)+4}px;font-weight:bold;color:${b.color};text-decoration:none;white-space:nowrap;">${esc(b.label)}</a>
</td>
</tr>
  </table>
  <!--<![endif]-->`;
    return `<tr>
  <td align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}">${mso}${btn}</td>
</tr>`;
  }

  case 'image': {
    const w = b.full ? s.width - (b.pl == null ? 0 : G.l) - (b.pr == null ? 0 : G.r) : px(b.width);
    const pad = b.full ? `${px(b.pt)}px ${b.pr == null ? 0 : G.r}px ${px(b.pb)}px ${b.pl == null ? 0 : G.l}px` : P;
    const img = `<img src="${esc(b.src)}" alt="${esc(b.alt)}" width="${w}" style="display:block;${marginFor(b.align)}width:100%;max-width:${w}px;height:auto;${px(b.radius) ? `border-radius:${px(b.radius)}px;` : ''}border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;">`;
    const wrapped = b.href ? `<a href="${esc(safeUrl(b.href))}" target="_blank" style="text-decoration:none;">${img}</a>` : img;
    const cap = b.caption ? `
<div style="font-family:${F};font-size:12px;line-height:18px;color:#7b8794;padding:8px ${G.r}px 0 ${G.l}px;text-align:${b.align};">${esc(b.caption)}</div>` : '';
    return `<tr>
<td align="${b.align}"${bgAttr(b)} style="padding:${pad};${bgStyle(b)}font-size:0;">${wrapped}${cap}</td>
</tr>`;
  }

  case 'columns': {
    const n = b.cols.length;
    const cw = Math.floor(inner / n);
    const gp = px(b.gap);
    let out = `<tr>
<td${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-size:0;">
<!--[if mso]>${tbl('width="100%"')}<tr><![endif]-->
`;
    b.cols.forEach((c,i) => {
      const pl = i === 0 ? 0 : Math.round(gp/2);

${tbl('width="100%"')}

<!--[if mso]></td><![endif]-->`;
    const txtCol = `<!--[if mso]><td width="${tw}" valign="${b.valign}"><![endif]-->
<div style="display:inline-block;width:100%;max-width:${tw}px;vertical-align:${b.valign};">
${tbl('width="100%"')}<tr><td style="font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};mso-line-height-rule:exactly;">

<span${de(o,'html')}>${sanitize(b.html,s)}</span>
${b.linkLabel ? `<div style="padding:10px 0 0;"><a href="${esc(safeUrl(b.linkHref))}" target="_blank" style="color:${s.link};text-decoration:underline;font-weight:bold;">${esc(b.linkLabel)}</a></div>` : ''}
</td></tr></table>
</div>
<!--[if mso]></td><![endif]-->`;
    return `<tr>
<td${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-size:0;">
<!--[if mso]>${tbl('width="100%"')}<tr><![endif]-->
${b.imgSide === 'left' ? imgCol + '\n' + txtCol : txtCol + '\n' + imgCol}
<!--[if mso]></tr></table><![endif]-->
</td>
</tr>`;
  }

  case 'list': {

<td width="${px(b.indent)}" valign="top" style="width:${px(b.indent)}px;font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${b.marker};padding-bottom:${px(b.spacing)}px;mso-line-height-rule:exactly;">${b.ordered ? (i+1)+'.' : '&bull;'}</td>
<td valign="top" style="font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};padding-bottom:${px(b.spacing)}px;mso-line-height-rule:exactly;"><span${de(o,'item:'+i)}>${sanitize(it,s)}</span></td>

${tbl('width="100%"', `background-color:${b.boxBg};`)}
<tr><td style="padding:${px(b.inner)}px ${px(b.inner)+2}px;border-left:${px(b.accentW)}px solid ${b.accent};font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};mso-line-height-rule:exactly;">
<span${de(o,'html')}>${sanitize(b.html,s)}</span>${b.cite ? `<br><br><span style="font-size:${Math.max(11,px(b.size)-2)}px;color:${b.citeColor};">${esc(b.cite)}</span>` : ''}
</td></tr>
</table>
</td>
</tr>`;

  case 'table': {
    const lines = String(b.data).split('\n').map(l => l.split('|').map(c => c.trim())).filter(l => l.join(''));
    if (!lines.length) return '';
    /* Pad short rows out so every row has the same cell count — a ragged table
       drops borders and shifts columns in the Word engine. */
    const cols = lines.reduce((max,l) => Math.max(max, l.length), 0);
    const grid = lines.map(l => l.length === cols ? l : l.concat(Array(cols - l.length).fill('')));
    const cellStyle = (i,last) => `padding:${px(b.cpy)}px ${px(b.cpx)}px;font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};${last ? '' : `border-bottom:1px solid ${b.border};`}mso-line-height-rule:exactly;`;
    let out = '';
    grid.forEach((row,r) => {
      const isHead = b.header && r === 0;
      out += `<tr>${row.map((c,i) => `<td align="${i ? b.alignR : 'left'}"${isHead ? ` bgcolor="${b.headBg}"` : ''} style="${cellStyle(i, r === grid.length-1)}${isHead ? `font-weight:bold;color:${b.headColor};` : ''}">${esc(c)}</td>`).join('')}</tr>\n`;
    });
    return `<tr>
<td${bgAttr(b)} style="padding:${P};${bgStyle(b)}">
${tbl('width="100%"')}
${out}</table>
</td>
</tr>`;
  }

  case 'links': {
    const gp = Math.round(px(b.gap)/2);
    const items = b.items.map(it => b.style === 'icon' && it.icon
      ? `<a href="${esc(safeUrl(it.href))}" target="_blank" style="display:inline-block;padding:0 ${gp}px;text-decoration:none;"><img src="${esc(it.icon)}" alt="${esc(it.label)}" width="${px(b.iconSize)}" height="${px(b.iconSize)}" style="display:block;border:0;"></a>`
      : `<a href="${esc(safeUrl(it.href))}" target="_blank" style="display:inline-block;padding:0 ${gp}px;font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.size)+10}px;color:${C};text-decoration:${b.underline ? 'underline' : 'none'};">${esc(it.label)}</a>`);
    const sep = b.style === 'icon' ? '' : `<span style="font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.size)+10}px;color:${C};">${esc(b.sep)}</span>`;
    return `<tr>
<td align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-size:0;">${items.join(sep)}</td>
</tr>`;
  }

  case 'divider': {
    const t = px(b.thickness) || 1;
    return `<tr>
<td${bgAttr(b)} style="padding:${P};${bgStyle(b)}">
${tbl('width="100%"')}
<tr><td height="${t}" bgcolor="${b.color}" style="height:${t}px;line-height:${t}px;font-size:0;mso-line-height-rule:exactly;">&nbsp;</td></tr>
</table>
</td>
</tr>`;
  }

  case 'spacer': {
    const h = px(b.h) || 1;
    return `<tr>
<td height="${h}"${bgAttr(b)} style="height:${h}px;line-height:${h}px;font-size:0;${bgStyle(b)}mso-line-height-rule:exactly;">&nbsp;</td>
</tr>`;
  }

  case 'footer':
    return `<tr>
<td align="${b.align}"${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};mso-line-height-rule:exactly;">
<span${de(o,'html')}>${sanitize(b.html,s)}</span>${b.unsub ? `<br><a href="${esc(safeUrl(b.unsubHref))}" target="_blank" style="color:${C};text-decoration:underline;">${esc(b.unsub)}</a>` : ''}
</td>
</tr>`;

  case 'html':
    return `<tr>
<td${bgAttr(b)} style="padding:${P};${bgStyle(b)}font-family:${F};font-size:${px(b.size)}px;line-height:${px(b.lh)}px;color:${C};">${sanitizeRawHtml(b.raw)}</td>
</tr>`;
  }
  return '';
}

function bodyHtml(o = {}) {
  const s = doc.settings;
  const rows = doc.blocks.map(b => block(b, s, o)).join('\n');
  const pre = s.preheader
    ? `<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:${s.cardBg};">${esc(s.preheader)}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>\n` : '';
  const dir = s.dir === 'rtl' ? ' dir="rtl"' : '';
  return `${pre}${tbl(`class="eb-page" width="100%"${dir} bgcolor="${s.pageBg}"`, `background-color:${s.pageBg};margin:0;padding:0;width:100%;`)}
<tr>
<td align="center" style="padding:24px 10px;">
<!--[if mso]>${tbl(`width="${s.width}"`)}<tr><td><![endif]-->
${tbl(`class="eb-card" width="100%" bgcolor="${s.cardBg}"`, `width:100%;max-width:${s.width}px;background-color:${s.cardBg};color:${s.text};${px(s.radius) ? `border-radius:${px(s.radius)}px;overflow:hidden;` : ''}`)}
${rows}
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td>
</tr>
</table>`;
}

function fullHtml() {
  const s = doc.settings;
  const reset = s.safeReset ? `
  #outlook a { padding:0; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  table { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
  a[x-apple-data-detectors],
  #MessageViewBody a,
  u + #body a {
    color: inherit !important;
    text-decoration: none !important;
    font-size: inherit !important;
    font-family: inherit !important;
    font-weight: inherit !important;
    line-height: inherit !important;
  }` : '';
  /* Gmail and Outlook.com invert colours regardless of the color-scheme hints,
     so the two wrappers are pinned back to the chosen palette. Keeping this to
     the wrappers leaves per-block colours — buttons, quote boxes — untouched. */
  const scheme = `
  @media only screen and (max-width:620px) {
    .eb-card { width:100% !important; max-width:100% !important; }
  }
  @media (prefers-color-scheme: dark) {
    .eb-page { background-color:${s.pageBg} !important; }
    .eb-card { background-color:${s.cardBg} !important; }
  }
  [data-ogsc] .eb-page, [data-ogsb] .eb-page { background-color:${s.pageBg} !important; }
  [data-ogsc] .eb-card, [data-ogsb] .eb-card { background-color:${s.cardBg} !important; }`;
  return `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="${esc(s.lang)}" dir="${s.dir}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<style type="text/css">${reset}${scheme}
</style>
<title></title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<![endif]-->
</head>
<body id="body" bgcolor="${s.pageBg}" style="margin:0;padding:0;background-color:${s.pageBg};color:${s.text};-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
${bodyHtml()}
</body>
</html>`;
}

/* ============================================================
   3. CHECKS
   ============================================================ */

/* Matched against real anchors only. Prose mentioning the word — a preheader,
   a paragraph — is not an opt-out, and an opt-out is not always called one. */
const UNSUB_RE = /unsub|opt[\s._-]?out|preference|manage[\s._-]?(your[\s._-]?)?(email|subscription)|remove[\s._-]?me/i;

function hasUnsubscribeLink(html) {
  const footerLink = doc.blocks.some(b => b.type === 'footer'
    && String(b.unsub || '').trim()
    && String(b.unsubHref || '').trim());
  if (footerLink) return true;
  return [...String(html).matchAll(/<a\s[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi)]
    .some(m => {
      const href = m[1];
      const label = m[2].replace(/<[^>]*>/g, ' ');
      return href && href !== '#' && (UNSUB_RE.test(href) || UNSUB_RE.test(label));
    });
}

function runChecks() {
  const s = doc.settings, out = [], html = bodyHtml();
  const profile = s.compatProfile || DEFAULT_SETTINGS.compatProfile;
  const push = (level, title, msg) => out.push({ level, title, msg });

  const noAlt = doc.blocks.filter(b => (b.type === 'image' || b.type === 'logo') && !String(b.alt||'').trim());
  if (noAlt.length) push('err','Images without alt text', `${noAlt.length} image${noAlt.length>1?'s':''} will show nothing when images are blocked. Write alt text that carries the message.`);

  const srcs = doc.blocks.flatMap(b => [b.src, b.img, ...(b.cols||[]).map(c=>c.img), ...(b.items||[]).map(i=>i&&i.icon)]).filter(Boolean);
  const insecure = srcs.filter(u => /^http:/i.test(u));
  if (insecure.length) push('err','Images served over http', 'Clients block mixed content and some strip the image entirely. Move these to https.');
  if (srcs.some(u => /\.svg(\?|$)/i.test(u))) push('err','SVG image found','Gmail, Outlook and Yahoo all refuse SVG. Export a PNG instead.');

  const hrefs = [...html.matchAll(/href="([^"]*)"/g)].map(m => m[1]);
  const bad = hrefs.filter(h => !h || h === '#' || h === 'https://');
  if (bad.length) push('warn','Placeholder links', `${bad.length} link${bad.length>1?'s':''} still point at a placeholder.`);

  if (!hasUnsubscribeLink(html)) push('err','No unsubscribe link','Bulk mail needs a working opt-out and a physical address, or you land in spam folders and breach CAN-SPAM, GDPR and the NZ Unsolicited Electronic Messages Act.');
  if (!s.preheader.trim()) push('warn','No preheader','Without it the client pulls your first line of body copy into the inbox preview.');

  const small = doc.blocks.filter(b => b.size && b.size < 14 && ['text','columns','list','feature','quote'].includes(b.type));
  if (small.length) push('warn','Body text under 14px','iOS bumps small text up automatically, which breaks your layout. 14–16px is the safe floor.');

  if (s.width > 640) push('warn','Container wider than 640px','Outlook reading panes and older webmail clip past roughly 640px.');

  const kb = new Blob([html]).size / 1024;
  if (kb > 102) push('err','Over the Gmail clip limit', `${kb.toFixed(1)} KB. Gmail truncates at 102 KB and hides your tracking pixel and footer behind a "view entire message" link.`);
  else if (kb > 70) push('warn','Approaching the clip limit', `${kb.toFixed(1)} KB of 102 KB.`);

  if (!s.safeReset) push('warn','Safe reset disabled','Apple and Gmail clients may auto-style links and fonts. Turn on Safe reset for more consistent rendering.');

  if (profile !== 'mainstream') {
    const threePlusCols = doc.blocks.some(b => b.type === 'columns' && (b.cols || []).length > 2);
    if (threePlusCols) push('warn','Three+ column layout','Broader provider support is stronger with one or two columns, especially in legacy Outlook reading panes.');

    const wideDataTable = doc.blocks.some(b => b.type === 'table' && String(b.data || '').split('\n')
      .some(r => r.split('|').map(c => c.trim()).filter(Boolean).length > 3));
    if (wideDataTable) push('warn','Wide table detected','Tables with more than 3 columns are more likely to overflow on narrow clients and older webmail panes.');
  }

  if (profile === 'legacy') {
    const featureBlocks = doc.blocks.filter(b => b.type === 'feature').length;
    if (featureBlocks) push('warn','Feature block in legacy profile', `${featureBlocks} feature block${featureBlocks > 1 ? 's are' : ' is'} present. Legacy clients are usually safer with stacked single-column sections.`);
    if (s.width > 600) push('warn','Legacy profile width target','For legacy-heavy support, keep container width at 600px or less.');
  }

  const unsafeRaw = doc.blocks.filter(b => b.type === 'html' && rawHtmlWasStripped(b.raw || ''));
  if (unsafeRaw.length) push('err','Unsafe raw HTML', `${unsafeRaw.length} raw block${unsafeRaw.length>1?'s were':''} sanitized to remove risky tags or attributes.`);

  if (doc.blocks.some(b => b.type === 'html')) push('warn','Raw HTML block in use','Raw blocks remain advanced/unsafe territory and should be tested in target clients after sanitization.');

  if (!out.length) push('ok','Nothing flagged','Every check passed. Still send a real test through Litmus, Email on Acid or your own seed list before you ship.');
  return out;
}

const CRITICAL_EXPORT_TITLES = new Set([
  'Images without alt text',
  'Placeholder links',
  'No unsubscribe link',
  'Images served over http',
  'SVG image found',
  'Over the Gmail clip limit'
]);

function criticalExportFindings() {
  return runChecks().filter(c => c.level === 'err' || CRITICAL_EXPORT_TITLES.has(c.title));
}

async function confirmCriticalExport(actionLabel) {
  const issues = criticalExportFindings();
  if (!issues.length) return true;
  const list = issues.map(i => `- ${i.title}`).join('\n');
  return askConfirm({
    title: 'Critical checks',
    message: `Critical issues found before ${actionLabel}:\n${list}\n\nContinue anyway?`,
    confirmText: 'Continue',
    cancelText: 'Cancel',
    danger: true
  });
}

/* ============================================================
   4. HISTORY
   ============================================================ */
const past = [], future = [];
function normalizeSettings(input) {
  const raw = input && typeof input === 'object' ? input : {};
  const next = { ...DEFAULT_SETTINGS, ...raw };
  next.width = Math.max(320, parseInt(next.width, 10) || DEFAULT_SETTINGS.width);
  next.pad = Math.max(0, parseInt(next.pad, 10) || DEFAULT_SETTINGS.pad);
  next.radius = Math.max(0, parseInt(next.radius, 10) || DEFAULT_SETTINGS.radius);
  next.safeReset = !(next.safeReset === false || String(next.safeReset).toLowerCase() === 'false');
  next.compatProfile = COMPAT_PROFILES.some(([k]) => k === next.compatProfile) ? next.compatProfile : DEFAULT_SETTINGS.compatProfile;
  next.dir = next.dir === 'rtl' ? 'rtl' : 'ltr';
  next.esp = ESP[next.esp] ? next.esp : DEFAULT_SETTINGS.esp;
  ['pageBg','cardBg','font','text','link','preheader','lang'].forEach(k => {
    if (typeof next[k] !== 'string') next[k] = DEFAULT_SETTINGS[k];
  });
  next.lang = /^[a-z]{2,3}(-[a-z0-9]{2,8})*$/i.test(next.lang.trim()) ? next.lang.trim() : DEFAULT_SETTINGS.lang;
  return next;
}

/* Blocks are handed round by reference — saved templates, history snapshots and
   the live document must never end up sharing the same nested arrays. */
function cloneData(value) {
  try { return structuredClone(value); }
  catch { try { return JSON.parse(JSON.stringify(value)); } catch { return value; } }
}

function normalizeBlocks(input) {
  const source = Array.isArray(input) ? input : [];
  if (source.length > MAX_BLOCK_COUNT) throw new Error(`State has too many blocks (${source.length}/${MAX_BLOCK_COUNT}).`);
  const used = new Set();
  const out = [];

  source.forEach(raw => {
    if (!raw || typeof raw !== 'object' || !DEFAULTS[raw.type]) return;
    const merged = { id: '', bg:'', pl:null, pr:null, ...DEFAULTS[raw.type](), ...cloneData(raw) };
    if (typeof merged.id !== 'string' || !merged.id.trim() || used.has(merged.id)) merged.id = nid();
    used.add(merged.id);

    if (merged.type === 'columns' && !Array.isArray(merged.cols)) merged.cols = DEFAULTS.columns().cols;
    if (merged.type === 'list' && !Array.isArray(merged.items)) merged.items = DEFAULTS.list().items;
    if (merged.type === 'links' && !Array.isArray(merged.items)) merged.items = DEFAULTS.links().items;

    out.push(merged);
  });

  return out;
}

function decodeStatePayload(input) {
  let parsed = input;
  if (typeof input === 'string') {
    if (input.length > MAX_STATE_BYTES) throw new Error(`State payload exceeds ${Math.round(MAX_STATE_BYTES/1024)} KB.`);
    try { parsed = JSON.parse(input); }
    catch { throw new Error('State file is not valid JSON.'); }
  }
  if (!parsed || typeof parsed !== 'object') throw new Error('Invalid state payload.');

  let state = parsed;
  if (state.version == null) {
    state = { version: 1, settings: state.settings, blocks: state.blocks, uid: state.uid };
  }
  if (state.version === 1) {
    state = { version: STATE_SCHEMA_VERSION, settings: state.settings, blocks: state.blocks, uid: state.uid };
  }
  if (state.version !== STATE_SCHEMA_VERSION) throw new Error(`Unsupported schema version: ${state.version}`);

  const settings = normalizeSettings(state.settings);
  const blocks = normalizeBlocks(state.blocks);
  const inferredUid = blocks.reduce((max, b) => {
    const m = /^b(\d+)$/.exec(b.id);
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);
  const stateUid = Math.max(0, parseInt(state.uid, 10) || 0);
  const savedAt = Math.max(0, parseInt(state.savedAt, 10) || 0) || Date.now();

  return {
    version: STATE_SCHEMA_VERSION,
    settings,
    blocks,
    uid: Math.max(inferredUid, stateUid),
    savedAt
  };
}

function statePayload() {
  return {
    version: STATE_SCHEMA_VERSION,
    settings: doc.settings,
    blocks: doc.blocks,
    uid,
    savedAt: Date.now()
  };
}

const snapshot = () => JSON.stringify(statePayload());
let draftTimer = 0;
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, snapshot()); } catch {}
}
function queueDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 180);
}
function readDraft() {
  try { return localStorage.getItem(DRAFT_KEY); } catch { return null; }
}
function snap() { past.push(snapshot()); if (past.length > 60) past.shift(); future.length = 0; syncHistory(); }
function restore(json) {
  const d = decodeStatePayload(json);
  doc.settings = d.settings; doc.blocks = d.blocks; uid = d.uid || uid;
  if (!doc.blocks.some(b => b.id === sel)) sel = null;
  render();
}
function undo() { if (!past.length) return; future.push(snapshot()); restore(past.pop()); syncHistory(); }
function redo() { if (!future.length) return; past.push(snapshot()); restore(future.pop()); syncHistory(); }
function syncHistory() { $('undoBtn').disabled = !past.length; $('redoBtn').disabled = !future.length; }

/* ============================================================
   5. TEMPLATES
   ============================================================ */
const BUILTIN_TEMPLATES = {
  'Product update': ['logo','image','heading','text','button','divider','columns','footer'],
  'Plain announcement': ['heading','text','list','button','divider','footer'],
  'Transactional receipt': ['logo','heading','text','table','divider','text','footer'],
  'Newsletter digest': ['logo','heading','text','feature','divider','feature','divider','quote','links','footer'],
  'Welcome email': ['logo','heading','text','button','feature','divider','quote','footer'],
  'Event invitation': ['logo','image','heading','text','list','button','divider','links','footer'],
  'Abandoned cart reminder': ['logo','heading','text','image','table','button','divider','footer'],
  'Onboarding checklist': ['logo','heading','text','list','feature','button','divider','footer'],
  'Webinar follow-up': ['logo','heading','text','button','divider','quote','text','links','footer'],
  'Seasonal promotion': ['logo','image','heading','text','button','columns','divider','links','footer'],
  'Customer feedback request': ['logo','heading','text','button','divider','quote','footer'],
  'Win-back campaign': ['logo','heading','text','feature','button','divider','list','footer'],
  'Blank': []
};

function readCustomTemplates() {
  try {
    const raw = localStorage.getItem(CUSTOM_TEMPLATES_KEY);
    if (!raw) return {};
    if (raw.length > MAX_STATE_BYTES * 8) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
    const out = {};
    Object.entries(parsed).forEach(([name, state]) => {
      const clean = cleanTemplateName(name);
      if (!clean || BUILTIN_TEMPLATES[clean] || out[clean]) return;
      try {
        const decoded = decodeStatePayload(state);
        out[clean] = { ...decoded, savedAt: decoded.savedAt || Date.now() };
      } catch {}
    });
    return out;
  } catch {
    return {};
  }
}

function cleanTemplateName(input) {
  return String(input || '').replace(/\s+/g, ' ').trim().slice(0, 60);
}

function templateFileName(name) {
  return cleanTemplateName(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'template';
}

function templateSummary(state) {
  const count = Array.isArray(state?.blocks) ? state.blocks.length : 0;
  const stamp = state?.savedAt ? new Date(state.savedAt).toLocaleString() : '';
  return `${count} block${count === 1 ? '' : 's'}${stamp ? ` · ${stamp}` : ''}`;
}

function keepTemplateLimit() {
  const names = Object.keys(customTemplates);
  if (names.length <= MAX_CUSTOM_TEMPLATES) return;
  const pruned = Object.entries(customTemplates)
    .sort((a,b) => (b[1]?.savedAt || 0) - (a[1]?.savedAt || 0))
    .slice(0, MAX_CUSTOM_TEMPLATES);
  customTemplates = Object.fromEntries(pruned);
}

function writeCustomTemplates() {
  keepTemplateLimit();
  try { localStorage.setItem(CUSTOM_TEMPLATES_KEY, JSON.stringify(customTemplates)); } catch {}
}

let customTemplates = readCustomTemplates();
keepTemplateLimit();

function syncTemplateSelect() {
  const starter = Object.keys(BUILTIN_TEMPLATES).map(name => ({
    value: `builtin:${name}`,
    label: name
  }));
  const custom = Object.keys(customTemplates).sort((a,b) => a.localeCompare(b)).map(name => ({
    value: `custom:${name}`,
    label: `${name} (custom)`
  }));
  const all = starter.concat(custom);
  $('tplSel').innerHTML = '<option value="">Start from…</option>'
    + all.map(t => `<option value="${esc(t.value)}">${esc(t.label)}</option>`).join('');
}

function renderTemplateManager() {
  const names = Object.keys(customTemplates).sort((a,b) => a.localeCompare(b));
  if (!names.length) {
    $('tplBody').innerHTML = '<div class="tplempty">No custom templates yet. Save your current design to create one.</div>';
    return;
  }
  $('tplBody').innerHTML = names.map(name => {
    const meta = templateSummary(customTemplates[name]);
    const safe = esc(name);
    return `<div class="tplrow">
  <div>
    <div class="tplname">${safe}</div>
    <div class="tplmeta">${esc(meta)}</div>
  </div>
  <div class="tplactions">
    <button class="btn icon" data-tpla="load" data-name="${safe}">open</button>
    <button class="btn icon" data-tpla="rename" data-name="${safe}">rename</button>
    <button class="btn icon" data-tpla="export" data-name="${safe}">export</button>
    <button class="btn icon" data-tpla="delete" data-name="${safe}">delete</button>
  </div>
</div>`;
  }).join('');
}

function exportCustomTemplate(name) {
  const state = customTemplates[name];
  if (!state) return;
  const payload = { version: 1, templates: { [name]: state } };
  download(JSON.stringify(payload, null, 2), `${templateFileName(name)}.json`, 'application/json');
}

function exportAllCustomTemplates() {
  const names = Object.keys(customTemplates);
  if (!names.length) { alert('No custom templates to export.'); return; }
  const payload = { version: 1, exportedAt: Date.now(), templates: customTemplates };
  download(JSON.stringify(payload, null, 2), 'emailbuilder-custom-templates.json', 'application/json');
}

async function importCustomTemplates(input) {
  const parsed = JSON.parse(input);
  let entries = [];

  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && parsed.templates && typeof parsed.templates === 'object') {
    entries = Object.entries(parsed.templates);
  } else if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && parsed.name && parsed.state) {
    entries = [[parsed.name, parsed.state]];
  }

  if (!entries.length) throw new Error('Template file format is not supported.');

  const valid = [];
  entries.forEach(([rawName, state]) => {
    const name = cleanTemplateName(rawName);
    if (!name || BUILTIN_TEMPLATES[name]) return;
    try {
      const decoded = decodeStatePayload(state);
      valid.push([name, { ...decoded, savedAt: Date.now() }]);
    } catch {}
  });

  if (!valid.length) throw new Error('No valid custom templates were found in that file.');

  const conflicts = valid.filter(([name]) => customTemplates[name]).map(([name]) => name);
  let replaceConflicts = true;
  if (conflicts.length) {
    replaceConflicts = await askConfirm({
      title: 'Template conflicts',
      message: `${conflicts.length} template name conflict${conflicts.length > 1 ? 's' : ''} found. Replace existing templates?`,
      confirmText: 'Replace',
      cancelText: 'Skip conflicts'
    });
  }

  let added = 0, replaced = 0, skipped = 0;
  valid.forEach(([name, state]) => {
    const exists = !!customTemplates[name];
    if (exists && !replaceConflicts) { skipped++; return; }
    customTemplates[name] = state;
    exists ? replaced++ : added++;
  });

  writeCustomTemplates();
  syncTemplateSelect();
  renderTemplateManager();
  alert(`Imported ${added + replaced} template${added + replaced === 1 ? '' : 's'} (${added} new, ${replaced} replaced${skipped ? `, ${skipped} skipped` : ''}).`);
}

function loadTemplate(templateId) {
  snap();
  if (templateId.startsWith('custom:')) {
    const name = templateId.slice(7);
    const saved = customTemplates[name];
    if (!saved) { alert('That custom template no longer exists.'); syncTemplateSelect(); return; }
    try {
      restore(saved);
    } catch {
      alert(`Custom template "${name}" is invalid and was removed.`);
      delete customTemplates[name];
      writeCustomTemplates();
      syncTemplateSelect();
      renderTemplateManager();
    }
    return;
  }

  const name = templateId.startsWith('builtin:') ? templateId.slice(8) : templateId;
  if (!BUILTIN_TEMPLATES[name]) return;
  doc.blocks = BUILTIN_TEMPLATES[name].map(t => newBlock(t));
  sel = null;
  render();
}

async function saveCurrentTemplate() {
  const input = await askPrompt({
    title: 'Save template',
    message: 'Template name',
    value: '',
    placeholder: 'My template',
    confirmText: 'Save'
  });
  if (input == null) return;
  const name = cleanTemplateName(input);
  if (!name) { alert('Template name cannot be empty.'); return; }
  if (BUILTIN_TEMPLATES[name]) { alert('That name is reserved by a starter template.'); return; }
  if (customTemplates[name] && !(await askConfirm({
    title: 'Replace template',
    message: `Replace custom template "${name}"?`,
    confirmText: 'Replace',
    cancelText: 'Cancel',
    danger: true
  }))) return;
  customTemplates[name] = cloneData(statePayload());
  writeCustomTemplates();
  syncTemplateSelect();
  renderTemplateManager();
}

const newBlock = t => ({ id: nid(), bg:'', pl:null, pr:null, ...DEFAULTS[t]() });

/* ============================================================
   6. CANVAS
   ============================================================ */
let sel = null, viewW = 0, tab = 'block';
const $ = id => document.getElementById(id);
const stagewrap = $('stagewrap');

function renderCanvas() {
  const s = doc.settings;
  stagewrap.style.maxWidth = (viewW || s.width + 40) + 'px';
  if (!doc.blocks.length) {
    stagewrap.innerHTML = '<div class="empty">No blocks yet. Add one from the left, or pick a starter from the top bar.</div>';
    return;
  }
  stagewrap.innerHTML = `<div class="canvas" style="background:${s.pageBg};padding:20px 10px;">
    <div id="cwrap" dir="${s.dir}" style="max-width:${s.width}px;margin:0 auto;background:${s.cardBg};${px(s.radius) ? `border-radius:${px(s.radius)}px;overflow:hidden;` : ''}"></div>
  </div>`;
  const host = $('cwrap');
  doc.blocks.forEach(b => {
    const w = document.createElement('div');
    w.className = 'blockwrap' + (sel === b.id ? ' sel' : '');
    w.dataset.id = b.id;
    w.draggable = true;
    w.innerHTML = `<span class="tag">${b.type}</span>
      <div class="bctl">
        <button data-a="up" title="Move up">↑</button>
        <button data-a="down" title="Move down">↓</button>
        <button data-a="dup" title="Duplicate">⧉</button>
        <button data-a="del" title="Delete">✕</button>
      </div>
      ${tbl('width="100%"', 'width:100%;')}${block(b, s, { edit:true })}</table>`;
    host.appendChild(w);
    wireEditable(w, b);
  });
}

function wireEditable(wrap, b) {
  wrap.querySelectorAll('[data-edit]').forEach(el => {
    el.contentEditable = 'true';
    el.spellcheck = true;
    el.addEventListener('beforeinput', () => { if (!el.dataset.dirty) { el.dataset.dirty = '1'; snap(); } });
    el.addEventListener('input', () => {
      const k = el.dataset.edit;
      if (k === 'text') b.text = el.textContent;
      else if (k === 'html') b.html = el.innerHTML;
      else if (k.startsWith('col:')) b.cols[+k.split(':')[1]].html = el.innerHTML;
      else if (k.startsWith('item:')) b.items[+k.split(':')[1]] = el.innerHTML;
      flagChecks();
    });
    el.addEventListener('focus', () => { if (sel !== b.id) { sel = b.id; tab = 'block'; renderInspector(); markSel(); } });
    el.addEventListener('blur', () => { el.dataset.dirty = ''; setTimeout(() => $('fmt').style.display = 'none', 160); });
    el.addEventListener('mouseup', showFmt);
    el.addEventListener('keyup', showFmt);
  });
}

const markSel = () => document.querySelectorAll('.blockwrap').forEach(w => w.classList.toggle('sel', w.dataset.id === sel));

stagewrap.addEventListener('click', e => {
  const wrap = e.target.closest('.blockwrap'); if (!wrap) return;
  const id = wrap.dataset.id;
  const i = doc.blocks.findIndex(b => b.id === id);
  const act = e.target.closest('[data-a]');
  if (act) {
    snap();
    const a = act.dataset.a;
    if (a === 'up' && i > 0) doc.blocks.splice(i-1, 0, doc.blocks.splice(i,1)[0]);
    if (a === 'down' && i < doc.blocks.length-1) doc.blocks.splice(i+1, 0, doc.blocks.splice(i,1)[0]);
    if (a === 'dup') doc.blocks.splice(i+1, 0, { ...structuredClone(doc.blocks[i]), id: nid() });
    if (a === 'del') { doc.blocks.splice(i,1); if (sel === id) sel = null; }
    render(); return;
  }
  if (sel !== id) { sel = id; tab = 'block'; renderInspector(); markSel(); }
});

let dragId = null;
stagewrap.addEventListener('dragstart', e => {
  const w = e.target.closest('.blockwrap');
  if (!w || e.target.isContentEditable) return;
  dragId = w.dataset.id; snap();
  e.dataTransfer.effectAllowed = 'move';
});
stagewrap.addEventListener('dragover', e => {
  if (!dragId) return;
  e.preventDefault();
  const over = e.target.closest('.blockwrap');
  if (!over || over.dataset.id === dragId) return;
  const from = doc.blocks.findIndex(b => b.id === dragId);
  const to = doc.blocks.findIndex(b => b.id === over.dataset.id);
  doc.blocks.splice(to, 0, doc.blocks.splice(from,1)[0]);
  renderCanvas();
});
stagewrap.addEventListener('dragend', () => { dragId = null; });

/* inspector input handling */
$('ibody').addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.k && el.dataset.col === undefined && el.dataset.item === undefined) return;
  if (!el.dataset.dirty) { el.dataset.dirty = '1'; snap(); }

  const b = doc.blocks.find(x => x.id === sel);

  if (el.dataset.col !== undefined) { b.cols[+el.dataset.col][el.dataset.ck] = el.value; renderCanvas(); flagChecks(); return; }
  if (el.dataset.item !== undefined) { b.items[+el.dataset.item][el.dataset.ck] = el.value; renderCanvas(); flagChecks(); return; }

  const k = el.dataset.k;
  if (k[0] === '$') {
    const key = k.slice(1);
    if (key === 'cols') {
      const n = +el.value;
      while (b.cols.length < n) b.cols.push({ img:'', html:'New column' });
      b.cols.length = n; render(); return;
    }
    if (key === 'items') { b.items = el.value.split('\n'); renderCanvas(); flagChecks(); return; }
    let sv = el.value;
    if (key === 'safeReset') sv = sv === 'true';
    doc.settings[key] = ['width','pad','radius'].includes(key) ? (parseInt(el.value,10) || 0) : sv;
    renderCanvas(); flagChecks(); syncColor(el,k); return;
  }

  let v = el.value;
  if (el.type === 'number') v = parseInt(v,10) || 0;
  if (v === 'true') v = true;
  if (v === 'false') v = false;
  if ((k === 'pl' || k === 'pr') && v === '') v = null;

  b[k] = v;
  if (['full','level','style','header','ordered'].includes(k)) { render(); return; }
  renderCanvas(); flagChecks(); syncColor(el,k);
});

$('ibody').addEventListener('change', e => { if (e.target.dataset) e.target.dataset.dirty = ''; });

function syncColor(el,k) {
  el.closest('.swatch')?.querySelectorAll(`[data-k="${k}"]`).forEach(o => { if (o !== el) o.value = el.value; });
}

$('ibody').addEventListener('click', e => {
  const b = doc.blocks.find(x => x.id === sel);
  if (e.target.id === 'deselect') { sel = null; render(); }
  if (e.target.id === 'recheck') renderInspector();
  if (e.target.id === 'addLink') { snap(); b.items.push({ label:'New link', href:'https://', icon:'' }); render(); }
  if (e.target.dataset.rmlink !== undefined) { snap(); b.items.splice(+e.target.dataset.rmlink,1); render(); }
});

$('tabs').addEventListener('click', e => {
  const t = e.target.closest('button')?.dataset.tab; if (!t) return;
  tab = t; renderInspector();

/* ============================================================
   9. DIALOGS
   ============================================================ */
let askState = null;

function askOpen(options) {
  if (askState) {
    const fallback = askState.kind === 'prompt' ? null : false;
    askState.resolve(fallback);
    askState = null;
  }

  const cfg = {
    kind: options.kind || 'confirm',
    title: options.title || 'Confirm',
    message: options.message || '',
    confirmText: options.confirmText || 'OK',
    cancelText: options.cancelText || 'Cancel',
    value: options.value || '',
    placeholder: options.placeholder || '',
    danger: !!options.danger,
    allowEmpty: !!options.allowEmpty
  };

  $('askTitle').textContent = cfg.title;
  $('askMsg').textContent = cfg.message;
  $('askCancelBtn').textContent = cfg.cancelText;
  $('askOkBtn').textContent = cfg.confirmText;
  $('askOkBtn').classList.toggle('danger', cfg.danger);

  const input = $('askInput');
  const needsInput = cfg.kind === 'prompt';
  input.style.display = needsInput ? 'block' : 'none';
  input.value = cfg.value;
  input.placeholder = cfg.placeholder;

  $('askModal').classList.add('open');

  return new Promise(resolve => {
    askState = { ...cfg, resolve };
    setTimeout(() => {
      if (needsInput) { input.focus(); input.select(); }
      else $('askOkBtn').focus();
    }, 0);
  });
}

function askClose(result) {
  if (!askState) return;
  const current = askState;
  askState = null;
  $('askModal').classList.remove('open');
  current.resolve(result);
}

function askCancel() {
  if (!askState) return;
  askClose(askState.kind === 'prompt' ? null : false);
}

function askSubmit() {
  if (!askState) return;
  if (askState.kind === 'prompt') {
    const value = $('askInput').value;
    if (!askState.allowEmpty && !String(value).trim()) return;
    askClose(value);
    return;
  }
  askClose(true);
}

function askConfirm(options) {
  return askOpen({ kind: 'confirm', ...options });
}

function askPrompt(options) {
  return askOpen({ kind: 'prompt', ...options });
}

$('askCancelBtn').addEventListener('click', askCancel);
$('askOkBtn').addEventListener('click', askSubmit);
$('askModal').addEventListener('click', e => { if (e.target.id === 'askModal') askCancel(); });

let savedRange = null;
function showFmt() {
  const s = window.getSelection(), bar = $('fmt');
  if (!s.rangeCount || s.isCollapsed) { bar.style.display = 'none'; return; }
  savedRange = s.getRangeAt(0).cloneRange();
  const r = savedRange.getBoundingClientRect();
  bar.style.display = 'flex';
  bar.style.left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, r.left + r.width/2 - bar.offsetWidth/2)) + 'px';
  bar.style.top = Math.max(8, r.top - bar.offsetHeight - 8) + 'px';
}

$('fmt').addEventListener('mousedown', async e => {
  if (e.target.tagName === 'SELECT') return;
  e.preventDefault();
  const cmd = e.target.closest('[data-cmd]')?.dataset.cmd; if (!cmd) return;
  const active = document.activeElement;
  if (cmd === 'link') {
    const url = await askPrompt({
      title: 'Insert link',
      message: 'Link URL',
      value: 'https://',
      placeholder: 'https://example.com',
      confirmText: 'Insert'
    });
    if (!url) return;
    if (savedRange) {
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(savedRange);
    }
    document.execCommand('createLink', false, url);
  } else {
    document.execCommand(cmd, false, null);
  }
  active?.dispatchEvent(new Event('input'));
});

$('tagSel').addEventListener('change', e => {
  const tag = e.target.value; e.target.selectedIndex = 0;
  if (!tag || !savedRange) return;
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(savedRange);
  document.execCommand('insertText', false, tag);
  document.activeElement?.dispatchEvent(new Event('input'));
});

$('tplBody').addEventListener('click', async e => {
  const btn = e.target.closest('[data-tpla]');
  if (!btn) return;
  const action = btn.dataset.tpla;
  const name = btn.dataset.name;
  if (!name || !customTemplates[name]) return;

  if (action === 'load') {
    loadTemplate(`custom:${name}`);
    $('tplModal').classList.remove('open');
    return;
  }

  if (action === 'rename') {
    const nextInput = await askPrompt({
      title: 'Rename template',
      message: 'New template name',
      value: name,
      placeholder: 'Template name',
      confirmText: 'Rename'
    });
    const next = cleanTemplateName(nextInput);
    if (!next || next === name) return;
    if (BUILTIN_TEMPLATES[next]) { alert('That name is reserved by a starter template.'); return; }
    if (customTemplates[next] && !(await askConfirm({
      title: 'Replace template',
      message: `Replace custom template "${next}"?`,
      confirmText: 'Replace',
      cancelText: 'Cancel',
      danger: true
    }))) return;
    customTemplates[next] = { ...cloneData(customTemplates[name]), savedAt: Date.now() };
    delete customTemplates[name];
    writeCustomTemplates();
    syncTemplateSelect();
    renderTemplateManager();
    return;
  }

  if (action === 'delete') {
    if (!(await askConfirm({
      title: 'Delete template',
      message: `Delete custom template "${name}"?`,
      confirmText: 'Delete',
      cancelText: 'Cancel',
      danger: true
    }))) return;
    delete customTemplates[name];
    writeCustomTemplates();
    syncTemplateSelect();
    renderTemplateManager();
    return;
  }

  if (action === 'export') exportCustomTemplate(name);
});

/* Editor chrome theme. Distinct from #darkBtn, which only previews the email
   itself under a forced-dark client. */
const THEME_KEY = 'email_builder_theme_v1';
const themeBtn = $('themeBtn');
function applyTheme(mode, persist) {
  const theme = mode === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  /* Label shows the theme you would switch *to*, so the icon reads as an action. */
  themeBtn.textContent = theme === 'light' ? '☾' : '☀';
  const label = theme === 'light' ? 'Switch editor to dark theme' : 'Switch editor to light theme';
  themeBtn.title = label;
  themeBtn.setAttribute('aria-label', label);
  if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch {} }
}
function storedTheme() {
  try {
    const raw = localStorage.getItem(THEME_KEY);
    return raw === 'light' || raw === 'dark' ? raw : null;
  } catch { return null; }
}
applyTheme(document.documentElement.dataset.theme, false);
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true);
});
if (window.matchMedia) {
  const sysLight = window.matchMedia('(prefers-color-scheme: light)');
  const onSysChange = e => { if (!storedTheme()) applyTheme(e.matches ? 'light' : 'dark', false); };
  if (sysLight.addEventListener) sysLight.addEventListener('change', onSysChange);
  else if (sysLight.addListener) sysLight.addListener(onSysChange);
}

function download(content, name, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  /* Revoking in the same tick cancels the download in some browsers. */
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ============================================================
   12. EXPORT
   ============================================================ */
function htmlToText(html) {
  const root = parseRawHtml(html).content;
  /* Stylesheet and script bodies are text nodes; without this their source
     lands in the plain-text part verbatim. */
  root.querySelectorAll('style,script,noscript,head,title,template').forEach(n => n.remove());
  root.querySelectorAll('a').forEach(a => {
    const href = String(a.getAttribute('href') || '').trim();
    const label = String(a.textContent || '').replace(/\s+/g, ' ').trim();
    const safeHref = href && href !== '#' && !/^javascript:/i.test(href) ? href : '';
    let text = label;
    if (!text) text = safeHref;
    else if (safeHref && text !== safeHref) text = `${text} (${safeHref})`;
    a.replaceWith(document.createTextNode(text));
  });
  root.querySelectorAll('br').forEach(n => n.replaceWith('\n'));
  root.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,tr').forEach(n => n.append('\n'));
  return root.textContent
    .replace(/\u200C/g, '')
    .replace(/\u00A0/g, ' ')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function textBody() {
  const lines = [];
  const pre = String(doc.settings.preheader || '').trim();
  if (pre) lines.push(pre, '');

  doc.blocks.forEach((b, i) => {
    switch (b.type) {
      case 'logo':
        if (b.alt) lines.push(`[Logo] ${b.alt}`);
        if (b.href) lines.push(`Website: ${b.href}`);
        break;
      case 'heading':
        if (b.text) lines.push(String(b.text).trim());
        break;
      case 'text':
        if (b.html) lines.push(htmlToText(b.html));
        break;
      case 'button':
        lines.push(`${b.label || 'Action'}: ${b.href || ''}`.trim());
        break;
      case 'image':
        if (b.alt) lines.push(`[Image] ${b.alt}`);
        if (b.caption) lines.push(String(b.caption).trim());
        break;
      case 'columns':
        (b.cols || []).forEach(c => { if (c.html) lines.push(htmlToText(c.html)); });
        break;
      case 'feature':
        if (b.title) lines.push(String(b.title).trim());
        if (b.html) lines.push(htmlToText(b.html));
        if (b.linkLabel || b.linkHref) lines.push(`${b.linkLabel || 'Link'}: ${b.linkHref || ''}`.trim());
        break;
      case 'list':
        (b.items || []).forEach((item, n) => lines.push(`${b.ordered ? `${n + 1}.` : '-'} ${htmlToText(item)}`));
        break;
      case 'quote':
        if (b.html) lines.push(htmlToText(b.html));
        if (b.cite) lines.push(String(b.cite).trim());
        break;
      case 'table': {
        const rows = String(b.data || '').split('\n')
          .map(r => r.split('|').map(c => c.trim()).filter(Boolean))
          .filter(r => r.length);
        rows.forEach((row, idx) => {
          lines.push(row.join(' | '));
          if (idx === 0 && b.header) lines.push('-'.repeat(Math.min(60, row.join(' | ').length)));
        });
        break;
      }
      case 'links':
        (b.items || []).forEach(it => lines.push(`${it.label || 'Link'}: ${it.href || ''}`.trim()));
        break;
      case 'divider':
        lines.push('---');
        break;
      case 'spacer':
        lines.push('');
        break;
      case 'footer':
        if (b.html) lines.push(htmlToText(b.html));
        if (b.unsub || b.unsubHref) lines.push(`${b.unsub || 'Unsubscribe'}: ${b.unsubHref || ''}`.trim());
        break;
      case 'html':
        if (b.raw) lines.push(htmlToText(sanitizeRawHtml(b.raw)));
        break;
    }
    if (i < doc.blocks.length - 1) lines.push('');
  });

  return lines
    .map(s => String(s || '').trimEnd())
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

let mode = 'body', minified = false;
function renderExport() {
  const textMode = mode === 'text';
  $('minBtn').disabled = textMode;
  let output = mode === 'body' ? bodyHtml() : mode === 'full' ? fullHtml() : textBody();
  if (!textMode && minified) output = output.replace(/\n\s*/g,'').replace(/>\s+</g,'><');
  $('code').textContent = output;
  const bytes = new Blob([output]).size;
  $('sizeLabel').textContent = (bytes/1024).toFixed(1) + (textMode ? ' KB text' : ' KB');
  const pct = textMode ? 0 : Math.min(100, bytes/102400*100);
  $('sizeBar').style.width = pct + '%';
  $('sizeBar').classList.toggle('warn', !textMode && pct > 70);
}
  $('exportBtn').addEventListener('click', async () => {

  $('modal').classList.add('open');

});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('askModal').classList.contains('open')) { askCancel(); return; }
    $('modal').classList.remove('open');

    e.preventDefault(); e.shiftKey ? redo() : undo();

  doc.settings = { ...DEFAULT_SETTINGS };

/* Top-level const bindings live in script scope, not on window, so the smoke
   suite cannot reach them from the host page without this. */
if (IS_TEST_MODE) {
  window.__test = { doc, ESP, DEFAULTS, DEFAULT_SETTINGS, BUILTIN_TEMPLATES, esc, px, safeUrl };
}

async function boot() {
  if (IS_TEST_MODE) {
    loadStarterTemplate();
    render();
    return;
  }

  const savedDraft = readDraft();
  if (savedDraft) {
    try {
      const useDraft = await askConfirm({
        title: 'Restore draft',
        message: 'Restore your last draft?',
        confirmText: 'Restore',
        cancelText: 'Start fresh'
      });
      if (useDraft) restore(savedDraft);
      else { loadStarterTemplate(); render(); }
    } catch {
      try { localStorage.removeItem(DRAFT_KEY); } catch {}
      loadStarterTemplate();
      render();
    }
  } else {
    loadStarterTemplate();
    render();
  }
}

void boot();
